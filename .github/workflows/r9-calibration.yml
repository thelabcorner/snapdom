name: snapDOM R9 hosted calibration

on:
  push:
    branches:
      - 'perf/v3-r9-*'
    paths:
      - '.github/workflows/r9-calibration.yml'
      - 'lane6-scratch/r9-calibration/**'
      - 'lane6-scratch/r9/bench-r9-controlled.mjs'
      - 'lane6-scratch/r9/protocol.mjs'
      - 'lane6-scratch/atlas/profiler/fixtures.mjs'
      - 'lane6-scratch/r5/run-with-timing-gate.mjs'
  workflow_dispatch:

concurrency:
  group: r9-calibration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}
  NODE_VERSION: '22.21.1'

jobs:
  prepare:
    name: Prepare immutable calibration bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      policy_sha256: ${{ steps.prepare.outputs.policy_sha256 }}
      bundle_sha256: ${{ steps.prepare.outputs.bundle_sha256 }}
      chromium_matrix: ${{ steps.prepare.outputs.chromium_matrix }}
      engine_matrix: ${{ steps.prepare.outputs.engine_matrix }}
      max_parallel: ${{ steps.prepare.outputs.max_parallel }}
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile measured bundle
        run: |
          set -euo pipefail
          npm run compile
          mkdir -p lane6-scratch/r9-calibration/bundle
          cp dist/snapdom.mjs lane6-scratch/r9-calibration/bundle/candidate.mjs

      - name: Freeze calibration identity
        id: prepare
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: node lane6-scratch/r9-calibration/prepare.mjs

      - name: Upload immutable prepared evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r9-cal-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lane6-scratch/r9-calibration/bundle/
            lane6-scratch/r9-calibration/prepared.json
          if-no-files-found: error
          retention-days: 30

  chromium:
    name: Chromium calibration r${{ matrix.replicate }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        replicate: ${{ fromJSON(needs.prepare.outputs.chromium_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download immutable bundle and plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r9-cal-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane6-scratch/r9-calibration

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hosted self-null calibration
        id: bench
        shell: bash
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set +e
          node lane6-scratch/r5/run-with-timing-gate.mjs --             node lane6-scratch/r9-calibration/run.mjs               --browser=chromium --replicate="${{ matrix.replicate }}"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          node lane6-scratch/r9-calibration/validate.mjs             --browser=chromium --replicate="${{ matrix.replicate }}" --gate-exit="$code"

      - name: Upload raw calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r9-cal-sample-chromium-r${{ matrix.replicate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lane6-scratch/r9/results/calibration-chromium-r${{ matrix.replicate }}.json
            lane6-scratch/r9-calibration/requests/calibration-chromium-r${{ matrix.replicate }}.json
            lane6-scratch/r9-calibration/decisions/calibration-chromium-r${{ matrix.replicate }}.json
            lane6-scratch/r5/results/timing-environment-latest.json
          if-no-files-found: warn
          retention-days: 30

  engines:
    name: ${{ matrix.entry.engine }} calibration r${{ matrix.entry.replicate }}
    needs: [prepare, chromium]
    if: always() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.engine_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download immutable bundle and plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r9-cal-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane6-scratch/r9-calibration

      - name: Install pinned browser
        run: npx playwright install --with-deps "${{ matrix.entry.engine }}"

      - name: Run hosted self-null calibration
        id: bench
        shell: bash
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set +e
          node lane6-scratch/r5/run-with-timing-gate.mjs --             node lane6-scratch/r9-calibration/run.mjs               --browser="${{ matrix.entry.engine }}" --replicate="${{ matrix.entry.replicate }}"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          node lane6-scratch/r9-calibration/validate.mjs             --browser="${{ matrix.entry.engine }}" --replicate="${{ matrix.entry.replicate }}" --gate-exit="$code"

      - name: Upload raw calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r9-cal-sample-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lane6-scratch/r9/results/calibration-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
            lane6-scratch/r9-calibration/requests/calibration-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
            lane6-scratch/r9-calibration/decisions/calibration-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
            lane6-scratch/r5/results/timing-environment-latest.json
          if-no-files-found: warn
          retention-days: 30

  closeout:
    name: Calibration aggregate / closeout
    needs: [prepare, chromium, engines]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download immutable plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r9-cal-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane6-scratch/r9-calibration

      - name: Download every calibration sample
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: r9-cal-sample-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane6-scratch/r9-calibration/aggregate-input

      - name: Aggregate fresh-runner calibration
        run: |
          node lane6-scratch/r9-calibration/aggregate.mjs             --input-dir=lane6-scratch/r9-calibration/aggregate-input

      - name: Upload calibration closeout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r9-calibration-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane6-scratch/r9-calibration/calibration-summary.json
          if-no-files-found: error
          retention-days: 60
