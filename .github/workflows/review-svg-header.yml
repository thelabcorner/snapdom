name: Review — exact SVG header fast path
on:
  push:
    branches: ['review/v3-svg-header-fastpath']
  pull_request:
    paths:
      - '.github/workflows/review-svg-header.yml'
      - 'src/exporters/svgHeaderFast.js'
      - 'src/exporters/toImg.js'
      - 'src/exporters/toCanvas.js'
      - 'scripts/r13-svg-clamp.node.test.mjs'
      - '__tests__/exporter.toImg.test.js'
      - 'scripts/svg-header-fast.node.test.mjs'
      - 'scripts/review-svg-header-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/svg-header-fast.node.test.mjs
      - run: node --test scripts/r13-svg-clamp.node.test.mjs
      - run: npm run lint
      - run: npm run test:types
      - run: npm run test:bundle
  browsers:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run compile
      - name: Exact decoded pixel guard and isolated header transform timing
        run: node scripts/review-svg-header-browser.mjs --engine=${{ matrix.engine }}
      - run: npx vitest run __tests__/exporter.toImg.test.js __tests__/exporter.safariPaths.test.js --browser.headless --reporter=dot
        env:
          BROWSER: ${{ matrix.engine }}
