name: snapDOM R10 F4 wall falsifier

# Hosted-only, staged, and deliberately narrow: this workflow answers ONE preregistered question
# about the per-root identity partition for shadow content. It cannot promote anything. A rejected
# partition is a settled answer, not a reason to add replicates.
#
# Staging saves public runner minutes. Chromium (8 fresh runners) decides; the Firefox/WebKit guard
# (4 each) runs ONLY on PROMISING and is aggregated per engine, never averaged with chromium.
#
# Artifacts are keyed on run_id, never run_attempt, so a rerun of failed jobs overwrites the retried
# cell in place and keeps the prepared artifact from the earlier attempt. The closeout combines
# prior-good and retried cells and fails closed on anything absent or duplicated.
#
# A consumer never spells an archive entry with the producer's own prefix. actions/upload-artifact
# roots an artifact at the least common ancestor of its `path:` search paths, and both
# actions/download-artifact and `gh run download` extract the archive CONTENTS into their
# destination directory. The cell artifact therefore carries `decisions/f4-chromium-rN.json` at its
# root, not `lane6-scratch/r10-shadow/decisions/...`. Run 37146183681 prepared and ran all eight
# chromium cells green and still collected 0/8 decisions, purely because the harvest read one
# directory too deep. lane6-scratch/r10-shadow/lib/workflow.mjs reconstructs that root from this
# file and contracts.test.mjs asserts every consumer path against it, so the producer and consumer
# halves cannot drift apart again. Each stage verdict is uploaded by the job that owns it.
#
# Gate logic lives in lane6-scratch/r10-shadow/validate.mjs (per cell: SAMPLE_VALID / INCOMPLETE /
# PROVENANCE_FAILURE only) and lane6-scratch/r10-shadow/aggregate.mjs (the only place the 1%
# question is answered). Thresholds live in F4_POLICY.json, hashed by prepare.mjs along with every
# file whose contents define a measurement.

on:
  push:
    branches:
      - 'perf/v3-r10-*'
    paths:
      - '.github/workflows/r10-f4-wall.yml'
      - 'lane6-scratch/r10-shadow/**'
      - 'lane6-scratch/r9/protocol.mjs'
      - 'lane6-scratch/r5/run-with-timing-gate.mjs'
      - '__tests__/helpers/shadowCards.js'
  workflow_dispatch:

concurrency:
  group: r10-f4-wall-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: ${{ github.sha }}
  NODE_VERSION: '22.21.1'
  LANE: lane6-scratch/r10-shadow
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare immutable F4 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      policy_sha256: ${{ steps.prepare.outputs.policy_sha256 }}
      bundle_sha256: ${{ steps.prepare.outputs.bundle_sha256 }}
      chromium_matrix: ${{ steps.prepare.outputs.chromium_matrix }}
      engine_matrix: ${{ steps.prepare.outputs.engine_matrix }}
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile measured bundle
        run: |
          set -euo pipefail
          npm run compile
          mkdir -p "$LANE/bundle"
          cp dist/snapdom.mjs "$LANE/bundle/candidate.mjs"

      - name: Freeze F4 identity
        id: prepare
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: node lane6-scratch/r10-shadow/prepare.mjs

      - name: Upload immutable prepared evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-f4-prepared-${{ github.run_id }}
          path: |
            lane6-scratch/r10-shadow/bundle/
            lane6-scratch/r10-shadow/prepared.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  chromium:
    name: Chromium F4 r${{ matrix.replicate }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        replicate: ${{ fromJSON(needs.prepare.outputs.chromium_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r10-f4-prepared-${{ github.run_id }}
          path: lane6-scratch/r10-shadow

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      # Install spikes CPU and disk; the ambient gate samples immediately afterwards and would
      # block for a reason that has nothing to do with the machine being busy. Settle first, and
      # treat "never settled" as the same class of outcome the ambient gate itself uses.
      - name: Adaptive post-install settle
        id: settle
        shell: bash
        run: |
          set +e
          node lane6-scratch/r10-shadow/settle.mjs --engine=chromium --replicate="${{ matrix.replicate }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Run hosted F4 ceiling measurement
        id: bench
        shell: bash
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set +e
          if [ "${{ steps.settle.outputs.exit }}" = "3" ]; then
            echo "settle never cleared; cell observes nothing"
            echo "exit=3" >> "$GITHUB_OUTPUT"
            # Recorded rather than raised: a red step here skips admission entirely, and a cell with
            # no decision document is exactly the 0/N harvest this lane must never produce.
            # validate.mjs maps gate-exit 3 to INCOMPLETE_EVIDENCE, which turns the cell red below.
            exit 0
          fi
          node lane6-scratch/r5/run-with-timing-gate.mjs -- \
            node lane6-scratch/r10-shadow/run.mjs \
            --browser=chromium --replicate="${{ matrix.replicate }}"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Admit or reject this cell
        shell: bash
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set +e
          node lane6-scratch/r10-shadow/validate.mjs \
            --browser=chromium --replicate="${{ matrix.replicate }}" \
            --gate-exit="${{ steps.bench.outputs.exit }}"
          code=$?
          set -e
          # The one step in a cell that may be red, and its exit code IS the decision: SAMPLE_VALID is
          # 0, INCOMPLETE_EVIDENCE is 2, PROVENANCE_FAILURE is 1. Exiting 0 here unconditionally is
          # what let a cell with no admissible evidence read as a passing job. The upload below is
          # `always()`, so this redness never costs the closeout its evidence.
          exit $code

      - name: Upload raw F4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-f4-sample-chromium-r${{ matrix.replicate }}-${{ github.run_id }}
          path: |
            lane6-scratch/r10-shadow/results/f4-chromium-r${{ matrix.replicate }}.json
            lane6-scratch/r10-shadow/results/settle-chromium-r${{ matrix.replicate }}.json
            lane6-scratch/r10-shadow/requests/f4-chromium-r${{ matrix.replicate }}.json
            lane6-scratch/r10-shadow/decisions/f4-chromium-r${{ matrix.replicate }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  stage_chromium:
    name: Chromium stage verdict
    needs: [prepare, chromium]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      state: ${{ steps.aggregate.outputs.state }}
      complete: ${{ steps.aggregate.outputs.complete }}
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r10-f4-prepared-${{ github.run_id }}
          path: lane6-scratch/r10-shadow

      # Every expected cell is fetched by its own run_id-keyed name. A cell that failed in an
      # earlier attempt has no artifact, which the download reports as a step failure; that is
      # tolerated here and resolved fail-closed by aggregate.mjs's exact-matrix audit.
      - name: Collect chromium cells
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$LANE/harvest/chromium" "$LANE/decisions"
          found=0
          for r in $(seq 0 7); do
            gh run download "$GITHUB_RUN_ID" \
              --name "r10-f4-sample-chromium-r${r}-$GITHUB_RUN_ID" \
              --dir "$LANE/harvest/chromium/r${r}" || echo "cell r${r} artifact absent"
            # Archive entry, relative to the artifact root. results/, requests/ and decisions/ are
            # siblings under the lane directory, so that directory is the root and no lane prefix
            # belongs on this path. This is the path run 37146183681 got wrong, for 0/8.
            src="$LANE/harvest/chromium/r${r}/decisions/f4-chromium-r${r}.json"
            if [ -f "$src" ]; then
              cp "$src" "$LANE/decisions/"
              found=$((found + 1))
            else
              echo "chromium cell r${r} produced no decision"
            fi
          done
          echo "chromium decisions collected: $found/8"

      - name: Aggregate the chromium stage
        id: aggregate
        shell: bash
        run: |
          set +e
          node lane6-scratch/r10-shadow/aggregate.mjs --stage=chromium \
            --input-dir=lane6-scratch/r10-shadow/decisions
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # An incomplete matrix is a red stage. The verdict document is written either way, so the
          # closeout reads the reason instead of rediscovering an empty harvest.
          exit $code

      # This job owns the chromium stage verdict, so this job uploads it. The closeout reads it back
      # by archive entry instead of recomputing it, which is what lets a closeout rerun see the stage
      # result from the attempt that produced it. overwrite: true, because a rerun of this stage must
      # replace its own verdict rather than accumulate a second one.
      - name: Upload chromium stage verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-f4-stage-chromium-${{ github.run_id }}
          path: lane6-scratch/r10-shadow/closeout/chromium.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  engines:
    name: ${{ matrix.entry.engine }} F4 r${{ matrix.entry.replicate }}
    needs: [prepare, stage_chromium]
    # Cross-engine guard only. A chromium REJECT or INCONCLUSIVE skips this job entirely, which is
    # the whole point of staging: no public runner minutes on an answered question.
    if: needs.stage_chromium.outputs.state == 'PROMISING'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.engine_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r10-f4-prepared-${{ github.run_id }}
          path: lane6-scratch/r10-shadow

      - name: Install pinned engine
        run: npx playwright install --with-deps "${{ matrix.entry.engine }}"

      - name: Adaptive post-install settle
        id: settle
        shell: bash
        run: |
          set +e
          node lane6-scratch/r10-shadow/settle.mjs --engine="${{ matrix.entry.engine }}" --replicate="${{ matrix.entry.replicate }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Run hosted F4 ceiling measurement
        id: bench
        shell: bash
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set +e
          if [ "${{ steps.settle.outputs.exit }}" = "3" ]; then
            echo "settle never cleared; cell observes nothing"
            echo "exit=3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node lane6-scratch/r5/run-with-timing-gate.mjs -- \
            node lane6-scratch/r10-shadow/run.mjs \
            --browser="${{ matrix.entry.engine }}" --replicate="${{ matrix.entry.replicate }}"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Admit or reject this cell
        shell: bash
        env:
          SNAPDOM_CANDIDATE_GIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set +e
          node lane6-scratch/r10-shadow/validate.mjs \
            --browser="${{ matrix.entry.engine }}" --replicate="${{ matrix.entry.replicate }}" \
            --gate-exit="${{ steps.bench.outputs.exit }}"
          code=$?
          set -e
          echo "cell exit=$code"
          # Propagated, not swallowed: zero evidence is never green. See the chromium cell above.
          exit $code

      - name: Upload raw F4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-f4-sample-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}-${{ github.run_id }}
          path: |
            lane6-scratch/r10-shadow/results/f4-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
            lane6-scratch/r10-shadow/results/settle-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
            lane6-scratch/r10-shadow/requests/f4-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
            lane6-scratch/r10-shadow/decisions/f4-${{ matrix.entry.engine }}-r${{ matrix.entry.replicate }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  stage_engines:
    name: Cross-engine stage verdict
    needs: [prepare, chromium, stage_chromium, engines]
    # Only reached when chromium promised, which is the only situation in which the guard ran at all.
    # always() so an incomplete engine matrix is aggregated and diagnosed rather than never reported.
    if: always() && needs.prepare.result == 'success' && needs.stage_chromium.outputs.state == 'PROMISING'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      state: ${{ steps.aggregate.outputs.state }}
      complete: ${{ steps.aggregate.outputs.complete }}
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r10-f4-prepared-${{ github.run_id }}
          path: lane6-scratch/r10-shadow

      # Same harvest discipline as the chromium stage, over the same run_id-keyed cell names, so a
      # retried guard cell overwrites in place and a cell that never ran stays visibly absent.
      - name: Collect engine cells
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$LANE/decisions"
          for e in firefox webkit; do
            for r in $(seq 0 3); do
              gh run download "$GITHUB_RUN_ID" \
                --name "r10-f4-sample-${e}-r${r}-$GITHUB_RUN_ID" \
                --dir "$LANE/harvest/${e}/r${r}" || echo "${e} cell r${r} artifact absent"
              src="$LANE/harvest/${e}/r${r}/decisions/f4-${e}-r${r}.json"
              [ -f "$src" ] && cp "$src" "$LANE/decisions/" || echo "${e} cell r${r} has no decision"
            done
          done

      - name: Aggregate the cross-engine guard
        id: aggregate
        shell: bash
        run: |
          set +e
          node lane6-scratch/r10-shadow/aggregate.mjs --stage=engines \
            --input-dir=lane6-scratch/r10-shadow/decisions
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # This job owns the cross-engine stage verdict, so this job uploads it. Before this producer
      # existed the closeout downloaded an artifact that no job had ever created.
      - name: Upload cross-engine stage verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-f4-stage-engines-${{ github.run_id }}
          path: lane6-scratch/r10-shadow/closeout/engines.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  closeout:
    name: F4 closeout
    needs: [prepare, chromium, stage_chromium, engines, stage_engines]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact measured head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r10-f4-prepared-${{ github.run_id }}
          path: lane6-scratch/r10-shadow

      # Both stages are collected independently so a closeout that reruns after a partial failure
      # sees prior-good cells alongside retried ones. Aggregate then requires the exact matrix.
      - name: Collect every cell from every attempt
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$LANE/harvest"
          for r in $(seq 0 7); do
            gh run download "$GITHUB_RUN_ID" \
              --name "r10-f4-sample-chromium-r${r}-$GITHUB_RUN_ID" \
              --dir "$LANE/harvest/chromium/r${r}" || echo "chromium cell r${r} absent"
          done
          if [ "${{ needs.stage_chromium.outputs.state }}" = "PROMISING" ]; then
            for e in firefox webkit; do
              for r in $(seq 0 3); do
                gh run download "$GITHUB_RUN_ID" \
                  --name "r10-f4-sample-${e}-r${r}-$GITHUB_RUN_ID" \
                  --dir "$LANE/harvest/${e}/r${r}" || echo "${e} cell r${r} absent"
              done
            done
          fi

      - name: Collect stage verdicts
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$LANE/decisions" "$LANE/closeout"
          for r in $(seq 0 7); do
            src="$LANE/harvest/chromium/r${r}/decisions/f4-chromium-r${r}.json"
            [ -f "$src" ] && cp "$src" "$LANE/decisions/" || echo "chromium cell r${r} has no decision"
          done
          if [ "${{ needs.stage_chromium.outputs.state }}" = "PROMISING" ]; then
            gh run download "$GITHUB_RUN_ID" --name "r10-f4-stage-chromium-$GITHUB_RUN_ID" \
              --dir "$LANE/harvest/stage-chromium" || echo "stage artifact absent"
            src="$LANE/harvest/stage-chromium/chromium.json"
            [ -f "$src" ] && cp "$src" "$LANE/closeout/" || echo "chromium stage verdict absent"
            for e in firefox webkit; do
              for r in $(seq 0 3); do
                src="$LANE/harvest/${e}/r${r}/decisions/f4-${e}-r${r}.json"
                [ -f "$src" ] && cp "$src" "$LANE/decisions/" || echo "${e} cell r${r} has no decision"
              done
            done
            gh run download "$GITHUB_RUN_ID" --name "r10-f4-stage-engines-$GITHUB_RUN_ID" \
              --dir "$LANE/harvest/stage-engines" || echo "engine stage artifact absent"
            src="$LANE/harvest/stage-engines/engines.json"
            [ -f "$src" ] && cp "$src" "$LANE/closeout/" || echo "cross-engine stage verdict absent"
          fi

      - name: Combine prior-good and retried cells into one state
        id: closeout
        shell: bash
        run: |
          set +e
          node lane6-scratch/r10-shadow/aggregate.mjs --stage=closeout
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # A red closeout must fail the workflow. Zero evidence is never green.
          exit $code

      - name: Upload closeout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-f4-closeout-${{ github.run_id }}
          path: lane6-scratch/r10-shadow/closeout/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30