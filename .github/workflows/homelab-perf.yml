name: Homelab Perf (autodetect)

on:
  push:
    branches: [perf/**, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Primary: GitHub-hosted (always available). Homelab self-hosted runner mirrors this file
  # with `runs-on: [self-hosted, homelab, linux]` when HOMELAB_RUNNER=1. Autodetect pattern:
  # keep this job on ubuntu-latest; homelab runner is configured to ALSO pick up ubuntu-latest
  # via runner labels or via a second workflow `homelab-perf-selfhosted.yml` on the homelab.
  perf-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Unit / smoke
        run: npm test -- --run 2>&1 | tail -n 100 || echo "no test script"
      - name: Playwright install
        run: npx playwright install --with-deps chromium 2>&1 | tail -n 20
      - name: Playwright correctness
        run: npx playwright test --reporter=line 2>&1 | tail -n 80 || echo "playwright not configured"
      - name: Synthetic bench (if harness present)
        run: node --experimental-vm-modules scripts/bench.mjs 2>&1 | tail -n 100 || echo "no bench harness yet"

  # Homelab self-hosted mirror — only runs when a runner with [self-hosted, homelab, linux] is online.
  # Uses `continue-on-error` semantics via `if: false` disabled by default; homelab enables by editing
  # this file locally to runs-on: [self-hosted, homelab] or by setting repo variable HOMELAB_ENABLED.
  # We keep it here commented as documentation; uncomment on homelab control plane.
  # perf-homelab:
  #   if: ${{ vars.HOMELAB_ENABLED == 'true' }}
  #   runs-on: [self-hosted, homelab, linux]
  #   timeout-minutes: 25
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: '20', cache: npm }
  #     - run: npm ci
  #     - run: npm run build
  #     - run: npx playwright install --with-deps chromium
  #     - run: npx playwright test --reporter=line
  #     - run: node scripts/bench.mjs
