name: snapDOM R17 isolated Chromium native-memory review

on:
  push:
    branches: ['perf/v3-r17-image-pss-review']
    paths:
      - 'scripts/r17pss-*'
      - '.github/workflows/r17-image-pss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout frozen R12 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b
          path: baseline
      - name: Checkout measured R17 production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5261af4114f5886d71645126ef26ecd74078e771
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
          cache: npm
      - name: Verify exact source commits
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b"
          test "$(git -C candidate rev-parse HEAD)" = "5261af4114f5886d71645126ef26ecd74078e771"
      - name: Build independent source outputs
        run: |
          npm ci --no-audit --no-fund
          (cd baseline && npm ci --no-audit --no-fund && npm run compile)
          (cd candidate && npm ci --no-audit --no-fund && npm run compile)
          npx playwright install --with-deps chromium
      - name: Isolated A/B and B/A browser process-set PSS
        env:
          BASELINE_SHA: ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b
          CANDIDATE_SHA: 5261af4114f5886d71645126ef26ecd74078e771
        run: node scripts/r17pss-isolated-browser.mjs --runner=${{ matrix.replica }} --baseline=baseline/dist/snapdom.mjs --candidate=candidate/dist/snapdom.mjs --out=r17-pss-evidence/runner-${{ matrix.replica }}.json
      - name: Preserve native-memory measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r17-pss-runner-${{ matrix.replica }}
          path: r17-pss-evidence/runner-${{ matrix.replica }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: memory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: r17-pss-runner-*
          path: r17-pss-evidence
          merge-multiple: true
      - name: Strict source and paired-cohort PSS review
        env:
          BASELINE_SHA: ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b
          CANDIDATE_SHA: 5261af4114f5886d71645126ef26ecd74078e771
        run: node scripts/r17pss-aggregate.mjs --dir=r17-pss-evidence --out=r17-pss-evidence/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r17-six-runner-native-memory-review
          path: r17-pss-evidence/summary.json
          if-no-files-found: error
          retention-days: 60
