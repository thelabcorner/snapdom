name: Micro Performance Race

on:
  push:
    branches: [perf/iterative-optimization, perf/micro-race]
    paths:
      - 'scripts/perf/micro/**'
      - '.github/workflows/micro-perf.yml'

concurrency:
  group: snapdom-micro-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  micro:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run micro-race corpus
        shell: bash
        run: |
          set -euo pipefail
          for bench in scripts/perf/micro/*.mjs; do
            echo "::group::$bench"
            node "$bench"
            echo "::endgroup::"
          done
