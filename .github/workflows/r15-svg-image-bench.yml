name: snapDOM R15 hosted SVG-image A/B research

on:
  push:
    branches:
      - 'perf/v3-r15-svg-image-memo'
    paths:
      - 'scripts/r15-svg-memo-browser.mjs'
      - 'scripts/r15-svg-aggregate.mjs'
      - '.github/workflows/r15-svg-image-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r15-svg-image-${{ github.ref }}
  cancel-in-progress: false

env:
  BASELINE_SHA: ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b
  CANDIDATE_SHA: b2fffe0e93b44b0f770cf94ba57623162188fe49
  NODE_VERSION: '22.21.1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify measurement harness did not mutate candidate source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git diff --exit-code "$CANDIDATE_SHA" -- src/ package.json package-lock.json esbuild.config.mjs
          node --check scripts/r15-svg-memo-browser.mjs
          node --check scripts/r15-svg-aggregate.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: .r15-baseline
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: .r15-candidate
      - name: Build frozen baseline
        working-directory: .r15-baseline
        run: npm ci --no-audit --no-fund && npm run compile
      - name: Build frozen candidate
        working-directory: .r15-candidate
        run: npm ci --no-audit --no-fund && npm run compile
      - name: Package immutable comparison
        shell: bash
        run: |
          mkdir -p lane6-scratch/r15/bundles
          cp .r15-baseline/dist/snapdom.mjs lane6-scratch/r15/bundles/baseline.mjs
          cp .r15-candidate/dist/snapdom.mjs lane6-scratch/r15/bundles/candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r15-prepared-${{ github.run_id }}
          path: lane6-scratch/r15/bundles/
          if-no-files-found: error
          retention-days: 30

  runner:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        replicate: [0, 1, 2, 3, 4, 5]
      max-parallel: 6
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r15-prepared-${{ github.run_id }}
          path: lane6-scratch/r15/bundles
      - run: npx playwright install --with-deps chromium
      - name: Paired SVG-image trial under hosted CPU governor
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node lane6-scratch/r5/run-with-timing-gate.mjs -- node scripts/r15-svg-memo-browser.mjs --baseline=lane6-scratch/r15/bundles/baseline.mjs --candidate=lane6-scratch/r15/bundles/candidate.mjs --runner=${{ matrix.replicate }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r15-runner-${{ matrix.replicate }}-${{ github.run_id }}
          path: |
            lane6-scratch/r15/results/runner-${{ matrix.replicate }}.json
            lane6-scratch/r5/results/timing-environment-latest.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [prepare, runner]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: r15-runner-*-${{ github.run_id }}
          path: lane6-scratch/r15/aggregate-input
      - name: Aggregate six runner-level effects
        run: node scripts/r15-svg-aggregate.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r15-summary-${{ github.run_id }}
          path: lane6-scratch/r15/results/summary.json
          if-no-files-found: warn
          retention-days: 60
