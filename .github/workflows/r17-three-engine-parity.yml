name: snapDOM R17 full-capture three-engine fidelity gate

on:
  push:
    branches: ['perf/v3-r17-three-engine-parity']
    paths:
      - 'scripts/r17-three-engine-*.mjs'
      - '.github/workflows/r17-three-engine-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout frozen R12 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b
          path: baseline
      - name: Checkout measured R17 implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5261af4114f5886d71645126ef26ecd74078e771
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
          cache: npm
      - name: Verify both frozen production sources
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b"
          test "$(git -C candidate rev-parse HEAD)" = "5261af4114f5886d71645126ef26ecd74078e771"
      - name: Build separately; install target engine
        run: |
          npm ci --no-audit --no-fund
          (cd baseline && npm ci --no-audit --no-fund && npm run compile)
          (cd candidate && npm ci --no-audit --no-fund && npm run compile)
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Eight balanced pairs and exact output and rendered pixels
        env:
          BASELINE_SHA: ce135fbfb73e358e99cfab266cb2ef5ffcff4d8b
          CANDIDATE_SHA: 5261af4114f5886d71645126ef26ecd74078e771
        run: node scripts/r17-three-engine-browser.mjs --runner=1 --engine=${{ matrix.browser }} --baseline=baseline/dist/snapdom.mjs --candidate=candidate/dist/snapdom.mjs --out=r17-engine-evidence/${{ matrix.browser }}.json
      - name: Preserve full per-engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r17-engine-${{ matrix.browser }}
          path: r17-engine-evidence/${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 60

  verdict:
    needs: browser-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: r17-engine-*
          path: r17-engine-evidence
          merge-multiple: true
      - run: node scripts/r17-three-engine-verify.mjs r17-engine-evidence
